<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.0" xmlns="http://www.w3.org/2000/svg"
 width="512" height="512" viewBox="0 0 512 512">
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer dashed radar ring -->
    <circle cx="256" cy="256" r="230" stroke-width="10" stroke-dasharray="24 16" opacity="0.8" />
    <circle cx="256" cy="256" r="210" stroke-width="4" opacity="0.4" />

    <!-- Corner brackets / HUD framing -->
    <path d="M 120 70 L 70 70 L 70 120" stroke-width="12" />
    <path d="M 392 70 L 442 70 L 442 120" stroke-width="12" />
    <path d="M 120 442 L 70 442 L 70 392" stroke-width="12" />
    <path d="M 392 442 L 442 442 L 442 392" stroke-width="12" />

    <!-- Mid ring with tick marks -->
    <circle cx="256" cy="256" r="160" stroke-width="8" stroke-dasharray="60 30" opacity="0.9" />

    <!-- 4 Inward Alignment Arrows -->
    <path d="M 256 30 L 256 75" stroke-width="10" />
    <polygon points="256,95 242,70 270,70" fill="#ffffff" stroke="none" />

    <path d="M 256 482 L 256 437" stroke-width="10" />
    <polygon points="256,417 242,442 270,442" fill="#ffffff" stroke="none" />

    <path d="M 30 256 L 75 256" stroke-width="10" />
    <polygon points="95,256 70,242 70,270" fill="#ffffff" stroke="none" />

    <path d="M 482 256 L 437 256" stroke-width="10" />
    <polygon points="417,256 442,242 442,270" fill="#ffffff" stroke="none" />

    <!-- Inner Target Bullseye & Crosshair -->
    <circle cx="256" cy="256" r="85" stroke-width="12" />
    <circle cx="256" cy="256" r="30" stroke-width="6" fill="#ffffff" fill-opacity="0.25" />
    <circle cx="256" cy="256" r="10" fill="#ffffff" stroke="none" />

    <!-- Precision Crosshairs -->
    <line x1="256" y1="120" x2="256" y2="150" stroke-width="8" />
    <line x1="256" y1="362" x2="256" y2="392" stroke-width="8" />
    <line x1="120" y1="256" x2="150" y2="256" stroke-width="8" />
    <line x1="362" y1="256" x2="392" y2="256" stroke-width="8" />
  </g>
</svg>
