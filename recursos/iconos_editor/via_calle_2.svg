<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Calzada de 2 carriles con aceras laterales -->
  <rect x="16" y="8" width="32" height="48" rx="3" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Bordillos -->
  <line x1="20" y1="10" x2="20" y2="54" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6"/>
  <line x1="44" y1="10" x2="44" y2="54" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6"/>
  <!-- Línea central discontinua -->
  <line x1="32" y1="13" x2="32" y2="21" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="32" y2="36" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="43" x2="32" y2="51" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
