<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Avenida de 4 carriles -->
  <rect x="10" y="8" width="44" height="48" rx="3" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Separador central sólido -->
  <rect x="30" y="9" width="4" height="46" rx="1.5" fill="#ffffff"/>
  <!-- Líneas de carril izquierdo -->
  <line x1="20" y1="13" x2="20" y2="21" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="20" y1="28" x2="20" y2="36" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="20" y1="43" x2="20" y2="51" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Líneas de carril derecho -->
  <line x1="44" y1="13" x2="44" y2="21" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="44" y2="36" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="44" y1="43" x2="44" y2="51" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
</svg>
