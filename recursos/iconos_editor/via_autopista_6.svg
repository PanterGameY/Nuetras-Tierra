<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Autopista de 6 carriles con bermas y mediana -->
  <rect x="6" y="8" width="52" height="48" rx="3" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Mediana doble central -->
  <rect x="29.5" y="9" width="5" height="46" rx="1.5" fill="#ffffff"/>
  <!-- Carriles izquierdos -->
  <line x1="14" y1="13" x2="14" y2="21" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="28" x2="14" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="43" x2="14" y2="51" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="13" x2="22" y2="21" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="28" x2="22" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="43" x2="22" y2="51" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Carriles derechos -->
  <line x1="42" y1="13" x2="42" y2="21" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="28" x2="42" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="43" x2="42" y2="51" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="13" x2="50" y2="21" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="28" x2="50" y2="36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="43" x2="50" y2="51" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
